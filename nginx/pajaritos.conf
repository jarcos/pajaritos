# pajaritos.josearcos.me
#
# Detrás del Cloudflare Tunnel: aquí NO hay TLS, NO hay redirecciones a https
# y NO hay certificados. Cloudflare termina TLS con el wildcard *.josearcos.me.
# cloudflared apunta a  pajaritos-web:8080  (Published application routes).

# Rate limit del único endpoint de escritura. Defensa en profundidad:
# Cloudflare también debe llevar una regla de rate limiting en el borde.
#
# La clave no puede ser directamente $http_cf_connecting_ip: si la cabecera no
# llega —acceso por LAN, WireGuard o un despiste de configuración— la variable
# queda vacía y nginx NO contabiliza esas peticiones, así que el límite se
# desactiva justo en el caso que no pasa por el borde. Con el map, si falta la
# cabecera se cae a la IP de la conexión.
map $http_cf_connecting_ip $clave_limite_reportes {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $clave_limite_reportes zone=reportes:10m rate=6r/m;

server {
    listen 8080;
    server_name pajaritos.josearcos.me;

    root /srv/app;
    index index.html;

    # El tunnel ya nos da la IP real en CF-Connecting-IP; no confiar en XFF a ciegas.
    real_ip_header CF-Connecting-IP;

    server_tokens off;
    client_max_body_size 16k;      # nada que subir: el reporte son ~2 KB

    # Todo se sirve del mismo origen: la CSP puede ser estricta de verdad.
    # OJO: add_header no se hereda en las locations que declaran el suyo, por
    # eso esto es un include que se repite en cada bloque. Ver cabeceras.conf.
    include /etc/nginx/cabeceras.conf;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # ── Sonda de vida ──
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Service Worker y index: NUNCA cachear ──
    # Un service worker rancio en caché es el clásico tiro en el pie:
    # deja al usuario clavado en una versión antigua para siempre.
    location = /sw.js {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = / {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
    }

    # ── Mareas: cambian a diario, TTL corto ──
    location = /datos/mareas.json {
        include /etc/nginx/cabeceras.conf;
        alias /srv/datos/mareas.json;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
    }

    # ── Basemap PMTiles ──
    # Crítico: gzip OFF y Content-Length intacto, o las peticiones Range se
    # rompen. Los tiles internos del .pmtiles ya vienen comprimidos.
    # El nombre del archivo va versionado, así que es inmutable y cacheable.
    location /mapas/ {
        include /etc/nginx/cabeceras.conf;
        alias /srv/mapas/;
        gzip off;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { } default_type application/octet-stream;
    }

    # ── Fotos: nombre versionado, inmutables ──
    location /fotos/ {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Datos de contenido: revalidación barata ──
    location /datos/ {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "public, max-age=600" always;
    }

    # ── Único endpoint de escritura de todo el sitio ──
    location = /api/reporte {
        limit_req zone=reportes burst=3 nodelay;
        limit_req_status 429;

        if ($request_method != POST) { return 405; }

        proxy_pass http://pajaritos-api:8000/reporte;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Cualquier otra ruta bajo /api/ no existe. Nada más es escribible.
    location /api/ { return 404; }

    # SPA: todo lo demás cae en index.html
    location / {
        include /etc/nginx/cabeceras.conf;
        try_files $uri $uri/ /index.html;
    }

    # Nada de ficheros ocultos ni restos de macOS
    location ~ /\. { deny all; }
    location ~ /\._ { deny all; }
}
