# Cabeceras de seguridad comunes.
#
# Van en un fichero aparte por una trampa de nginx: `add_header` NO se hereda
# del bloque server en cualquier location que declare su propio `add_header`.
# Como casi todas las locations fijan su Cache-Control, sin este include la
# CSP desaparecía justo donde más importa: la raíz, index.html y sw.js.
# Por eso se incluye explícitamente en cada bloque.

add_header X-Content-Type-Options    "nosniff"            always;
add_header Referrer-Policy           "no-referrer"        always;
add_header X-Frame-Options           "DENY"               always;
add_header Permissions-Policy        "geolocation=(self)" always;
add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
